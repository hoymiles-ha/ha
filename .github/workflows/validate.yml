name: Validate

# Runs HACS + hassfest validation so problems are caught in CI instead of
# in users' HACS installations.

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
          # Uncomment an entry if a check cannot pass yet and you accept the
          # trade-off. `brands` is satisfied by the bundled
          # custom_components/hoymiles/brand/icon.png, so it is NOT ignored.
          # ignore: brands

  hassfest:
    name: hassfest validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: hassfest validation
        uses: home-assistant/actions/hassfest@master
