set_tou_day_plan:
  name: Set TOU day plan
  description: Publish one TOU day plan (day1..day8) to a Hoymiles micro storage device.
  fields:
    device_id:
      name: Device
      description: Target device picked from the device registry. Alternative to Device ID.
      required: false
      selector:
        device:
          integration: hoymiles
    dev_id:
      name: Device ID
      description: Device identifier, in the form client_prefix-SN. Optional when a device is selected.
      required: false
      example: "MSA-280520260806"
      selector:
        text:
    day_idx:
      name: Day plan index
      description: Day plan index in range 1..8.
      required: true
      example: 1
      selector:
        number:
          min: 1
          max: 8
          step: 1
          mode: box
    day_plan:
      name: Day plan
      description: List of time segments (max 12). ts/te are 15-minute slots (0-96).
      required: true
      example: '[{"mode":1,"ts":0,"te":5,"sh":55,"sl":10,"pc":1000,"pd":1000}]'
      selector:
        object:

set_tou_week_plan:
  name: Set TOU week plan
  description: Publish the weekday to day-plan mapping.
  fields:
    device_id:
      name: Device
      description: Target device picked from the device registry. Alternative to Device ID.
      required: false
      selector:
        device:
          integration: hoymiles
    dev_id:
      name: Device ID
      description: Device identifier, in the form client_prefix-SN. Optional when a device is selected.
      required: false
      example: "MSA-280520260806"
      selector:
        text:
    week_plan:
      name: Week plan
      description: List of {"week":["Mon","Tue"],"day_idx":1} entries.
      required: true
      example: '[{"week":["Mon","Tue"],"day_idx":1}]'
      selector:
        object:

get_tou_plan:
  name: Get TOU plan
  description: Query the plan configured for one weekday.
  fields:
    device_id:
      name: Device
      description: Target device picked from the device registry. Alternative to Device ID.
      required: false
      selector:
        device:
          integration: hoymiles
    dev_id:
      name: Device ID
      description: Device identifier, in the form client_prefix-SN. Optional when a device is selected.
      required: false
      example: "MSA-280520260806"
      selector:
        text:
    week:
      name: Weekday
      description: One of Mon, Tue, Wed, Thu, Fri, Sat, Sun.
      required: true
      example: Mon
      selector:
        select:
          options: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]

set_ems_mode:
  name: Set EMS mode
  description: Switch the EMS mode of the device.
  fields:
    device_id:
      name: Device
      description: Target device picked from the device registry. Alternative to Device ID.
      required: false
      selector:
        device:
          integration: hoymiles
    dev_id:
      name: Device ID
      description: Device identifier, in the form client_prefix-SN. Optional when a device is selected.
      required: false
      example: "MSA-280520260806"
      selector:
        text:
    mode:
      name: Mode
      description: general (self-consumption), mqtt_ctrl (MQTT power control) or tou_plan (time-of-use).
      required: true
      example: tou_plan
      selector:
        select:
          options: [general, mqtt_ctrl, tou_plan]

reboot:
  name: Reboot device
  description: Send the RESTART command to the device.
  fields:
    device_id:
      name: Device
      description: Target device picked from the device registry. Alternative to Device ID.
      required: false
      selector:
        device:
          integration: hoymiles
    dev_id:
      name: Device ID
      description: Device identifier, in the form client_prefix-SN. Optional when a device is selected.
      required: false
      example: "MSA-280520260806"
      selector:
        text:

set_phase_output_power:
  name: Set multi phase output power
  description: >-
    Set the output power limit of all three phases at once. The firmware expects a
    complete JSON object, so all three phases are required.
  fields:
    device_id:
      name: Device
      description: Target device picked from the device registry. Alternative to Device ID.
      required: false
      selector:
        device:
          integration: hoymiles
    dev_id:
      name: Device ID
      description: Device identifier, in the form client_prefix-SN. Optional when a device is selected.
      required: false
      example: "MSA-280520260806"
      selector:
        text:
    phase_a:
      name: Phase A limit
      description: Output power limit of phase A in watt.
      required: true
      example: 800
      selector:
        number:
          min: 100
          max: 2500
          step: 1
          mode: box
    phase_b:
      name: Phase B limit
      description: Output power limit of phase B in watt.
      required: true
      example: 800
      selector:
        number:
          min: 100
          max: 2500
          step: 1
          mode: box
    phase_c:
      name: Phase C limit
      description: Output power limit of phase C in watt.
      required: true
      example: 800
      selector:
        number:
          min: 100
          max: 2500
          step: 1
          mode: box
