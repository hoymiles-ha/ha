set_optional_charts:
  name: Set optional device charts
  description: Enable or disable the opt-in Device-view curves. This is a whole-state write - a key that is left out is disabled, so send the complete set.
  fields:
    device_id:
      name: Device
      description: Target device picked from the device registry. Alternative to Device ID.
      required: false
      selector:
        device:
          integration: hoymiles_g2
    dev_id:
      name: Device ID
      description: Device identifier, in the form client_prefix-SN. Optional when a device is selected.
      required: false
      example: "RMI-4161A0209FF6"
      selector:
        text:
    charts:
      name: Charts
      description: Object of chart key to boolean. Keys - grid_current, grid_frequency, active_power, reactive_power, rssi.
      required: true
      example: '{"grid_current": true, "rssi": true}'
      selector:
        object:


